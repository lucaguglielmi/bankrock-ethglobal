name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A second push to the same branch cancels the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The production build must never be produced with demo mode on. The flag defaults to
      # false, and it is also set here explicitly so that a change to that default cannot turn
      # CI's build into a simulated one without this line changing too (spec 15 D-013).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `pretest` compiles and refreshes contracts/abi/BankRockRegistry.json, so a stale
      # committed ABI shows up as a dirty working tree in the next step.
      - name: Test
        run: npm test

      - name: Check the exported ABI is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- abi)" ]; then
            echo "contracts/abi does not match the compiled contracts."
            echo "Run 'npm run build' in contracts/ and commit contracts/abi/BankRockRegistry.json."
            git status --porcelain -- abi
            git diff -- abi
            exit 1
          fi

      # `postcompile` also regenerates the web app's copies of the ABIs, so the same run that
      # produced contracts/abi has already refreshed them. A dirty file here means a committed
      # copy the web app compiles against no longer matches the contract — which does not fail
      # loudly at runtime, it just encodes the wrong calldata.
      - name: Check the web ABI modules are committed and up to date
        working-directory: .
        run: |
          TARGETS="web/src/lib/chain/abi/registry.ts web/src/lib/chain/abi/aqua-app.ts"
          if [ -n "$(git status --porcelain -- $TARGETS)" ]; then
            echo "A generated web ABI module does not match the compiled contracts."
            echo "Run 'node scripts/sync-web-abi.mjs' from the repository root and commit the result."
            git status --porcelain -- $TARGETS
            git diff -- $TARGETS
            exit 1
          fi

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `prebuild` regenerates registry-abi.ts from contracts/abi, so this also catches the
      # MCP server compiling against an ABI the contracts no longer have.
      - name: Build
        run: npm run build

      - name: Check the generated registry ABI module is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- registry-abi.ts)" ]; then
            echo "mcp/registry-abi.ts does not match contracts/abi/BankRockRegistry.json."
            echo "Run 'npm run sync-abi' in mcp/ and commit the result."
            git diff -- registry-abi.ts
            exit 1
          fi

  spec-checks:
    name: Spec definition-of-done checks
    runs-on: ubuntu-latest
    # Blocking: the Wave 3 UI migration has landed, so every static check in spec 15 Part 7 and
    # spec 17 Part 7 is expected to pass on every PR from here on.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the spec 15 and spec 17 static checks
        run: bash scripts/spec-checks.sh

  e2e-responsive:
    name: Responsive UI and accessibility (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Built in demo mode so every surface renders (spec 17 Part 7's own preamble). No chain is
      # configured here, so a rock page reads UNAVAILABLE and shows its honest empty state
      # (spec 15 Part 3) — the browser checks are written to skip, not fail, the assertions that
      # depend on a real registry (see the comment at the top of web/e2e/responsive.spec.ts).
      - name: Build (demo mode)
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"

      # `npm run e2e` starts `next start` itself via Playwright's `webServer` (playwright.config.ts).
      - name: Run the spec 17 Part 7 browser checks
        run: npm run e2e
