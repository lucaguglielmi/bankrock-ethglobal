name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# One deploy at a time; a newer push waits rather than racing an in-flight upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./web

    # Decision D-013: demo mode is opt-in and must never be on in production. It defaults to
    # false, and is pinned here as well so the production build cannot become a simulation
    # through a change to that default alone. `npm run deploy` runs the OpenNext build, so the
    # flag has to be in scope for the whole job, not just a build step.
    #
    # Everything else comes from repository/environment secrets. No secret is committed to this
    # repository (spec 16); the Cloudflare Worker `web` holds the runtime environment variables
    # and the D1 binding (web/wrangler.jsonc), and only the two credentials below are needed to
    # publish.
    env:
      NEXT_PUBLIC_DEMO_MODE: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Fail early if Cloudflare credentials are missing
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            echo "Create the token in the Cloudflare dashboard with: Account > Workers Scripts > Edit,"
            echo "Account > D1 > Edit, Zone (bank-rock.com) > Workers Routes > Edit and DNS > Edit."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Migrations are additive (create table / add column) and the Worker's routes need the
      # tables to exist, so they are applied before the new code goes live. `bankrock-db` and
      # its binding come from web/wrangler.jsonc.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply bankrock-db --remote

      # Production is the Cloudflare Worker `web` (web/wrangler.jsonc: OpenNext worker, assets,
      # D1 binding, and the custom domains bank-rock.com / www.bank-rock.com). `npm run deploy`
      # builds with @opennextjs/cloudflare (decision D-016) and publishes that Worker. The
      # `deploy:pages` script still exists for a manual Pages preview, but no domain points at it.
      - name: Build and deploy the Worker
        run: npm run deploy
